<!doctype html>
<!-- 文件作用：隔离浮窗与候选人侧栏的紧凑简历操作界面，不包含账号登录或本地程序设置。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GoodHR 简历助手</title><link rel="stylesheet" href="ui.css"></head>
<body class="floating">
  <main>
    <section id="update-notice" class="update-notice" hidden><strong id="update-title"></strong><p id="update-versions"></p><a id="update-link" class="button primary" href="https://goodhr.58it.cn/download#browser-extension" target="_blank" rel="noreferrer">立即更新</a></section>
    <div class="candidate-state"><span id="state-dot" class="state-dot"></span><strong id="duplicate-status" role="status" aria-live="polite">正在读取</strong></div>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <form id="candidate-form">
      <div class="candidate-head"><img id="candidate-avatar" alt="候选人头像" width="32" height="32" hidden><div class="grid"><input id="name" aria-label="姓名" maxlength="80" required placeholder="姓名"><input id="phone" aria-label="手机号" inputmode="tel" maxlength="32" required placeholder="请补填完整手机号"></div></div>
      <p id="candidate-info" class="muted"></p>
      <div id="duplicates" aria-live="polite"></div>
      <details id="resume-details"><summary>简历资料 / 相似线索</summary><div class="grid"><label>邮箱<input id="candidate-email" type="email" maxlength="120"></label><label>城市<input id="city" maxlength="80"></label><label>当前职位<input id="position" maxlength="120"></label><label>期望职位<input id="expected-position" maxlength="120"></label></div><div class="inline search"><input id="duplicate-keyword" placeholder="姓名、学校、公司" maxlength="200" aria-label="相似查询关键字"><button id="check" type="button">查重</button></div><div id="duplicate-criteria" class="muted"></div><div id="resume-preview"></div></details>
      <section class="jobs"><strong>推荐到岗位（可选）</strong><input id="job-filter" type="search" placeholder="岗位、公司或城市" maxlength="120" aria-label="筛选岗位"><select id="job" aria-label="岗位" hidden><option value="">暂不推荐</option></select><div id="job-options" class="radio-list"></div><details id="recommendation-details" hidden><summary>推荐状态与备注</summary><select id="stage" aria-label="推荐状态"><option value="draft">已关联</option><option value="recommended">已推荐</option><option value="contacting">沟通中</option><option value="interview">面试中</option><option value="offer">Offer</option><option value="hired">已入职</option><option value="paused">暂停</option></select><textarea id="recommendation-note" rows="2" maxlength="1000" aria-label="推荐备注" placeholder="推荐进展（可选）"></textarea><input id="recommendation-time" type="datetime-local" aria-label="推荐发生时间"></details></section>
      <textarea id="note" rows="2" maxlength="1000" aria-label="备注" placeholder="可选备注，添加后保存"></textarea>
      <details class="note-time"><summary>备注时间（可选）</summary><input id="note-time" type="datetime-local" aria-label="备注发生时间"></details>
      <div class="actions"><button id="save" class="primary" type="submit" title="Alt+Enter 添加">添加</button><button id="update" class="primary" type="button" hidden>更新</button><button id="save-note" type="button" hidden>备注</button><button id="save-recommendation" type="button" hidden>推荐</button><button id="summary" type="button">AI总结</button><button id="reload" type="button">重读</button><button id="retry-avatar" type="button" hidden>重试头像</button></div>
      <section id="summary-panel" hidden><p id="summary-status" class="muted"></p><p id="summary-content"></p><div class="actions"><button id="summary-cancel" type="button" hidden>取消</button><button id="summary-retry" type="button" hidden>重试总结</button><button id="summary-save" type="button" hidden>保存总结</button></div></section>
    </form>
    <section id="records" hidden><div class="record-heading">备注和推荐记录 <a id="candidate-link" target="_blank" rel="noreferrer" hidden>查看完整简历</a></div><div id="notes"></div><div id="recommendations"></div></section>
  </main><script src="shared.js"></script><script src="candidate-ui.js"></script>
</body></html>
