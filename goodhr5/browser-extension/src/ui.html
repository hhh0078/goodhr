<!doctype html>
<!-- 文件作用：插件工具栏账号与设置入口，仅负责登录、配对、数据用途授权和版本更新。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GoodHR 插件设置</title><link rel="stylesheet" href="ui.css"></head>
<body class="settings">
  <header><div class="brand"><img src="../icons/32.png" width="28" height="28" alt="GoodHR"><strong>GoodHR</strong><small id="version"></small></div></header>
  <main>
    <section id="update-notice" class="update-notice" hidden><strong id="update-title"></strong><p id="update-versions"></p><a id="update-link" class="button primary" href="https://goodhr.58it.cn/download#browser-extension" target="_blank" rel="noreferrer">立即更新</a></section>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <section id="revocation-panel" hidden><p id="revocation-message" class="error"></p><button id="revoke-retry" type="button">重试撤销旧授权</button></section>
    <section id="account-row" class="account" hidden><span id="account"></span><button id="logout" class="quiet" type="button">退出登录</button></section>
    <section id="login-panel" hidden>
      <div class="tabs" role="tablist" aria-label="登录方式"><button id="password-mode" type="button" role="tab" aria-pressed="true">密码登录</button><button id="code-mode" type="button" role="tab" aria-pressed="false">验证码登录</button><button id="local-mode" type="button" role="tab" aria-pressed="false">本地程序登录</button></div>
      <form id="login-form">
        <label>GoodHR 邮箱<input id="email" type="email" autocomplete="username" required></label>
        <label id="password-row">密码<input id="password" type="password" autocomplete="current-password"></label>
        <label id="code-row" hidden>邮箱验证码<div class="inline"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12"><button id="send-code" type="button">获取验证码</button></div></label>
        <label class="check"><input id="agreement" type="checkbox" required>同意 <a href="https://goodhr.58it.cn/login" target="_blank" rel="noreferrer">使用协议与隐私说明</a></label>
        <button class="primary" type="submit">登录</button>
      </form>
    </section>
    <section id="pair-panel" class="local-login-panel" hidden>
      <div class="local-login-title"><strong id="pair-heading">本地程序登录</strong><small id="pair-state"></small></div>
      <label>程序端口<div class="inline"><input id="local-port" type="number" min="1" max="65535" value="43129"><button id="pair" class="primary" type="button">连接并登录</button></div></label>
      <div class="local-login-foot"><button id="restore" class="quiet" type="button">恢复上次连接</button><p id="pair-status" class="muted" hidden></p></div>
    </section>
    <section class="consent"><label class="check"><input id="consent" type="checkbox">允许读取可见简历并查重，确认后保存；BOSS 附件识别会把纯文本交给我当前配置的 AI，可能计费</label><a href="privacy.html" target="_blank" rel="noreferrer">数据说明</a></section>
    <section class="preferences"><label class="check"><input id="auto-close" type="checkbox" checked>添加后自动收起</label><small>BOSS 附件提交 0.5 秒后收起，后台继续入库。</small></section>
    <p class="muted">打开候选人详情，简历助手会自动展开。</p>
  </main><script src="shared.js"></script><script src="ui.js"></script>
</body></html>
