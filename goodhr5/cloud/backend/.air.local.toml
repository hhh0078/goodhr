# 本文件配置本地 Docker 中的 Go 热更新；使用轮询以兼容 Windows 的目录挂载。
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/goodhr-server ./cmd/server"
bin = "./tmp/goodhr-server"
delay = 500
exclude_dir = ["tmp", "vendor"]
include_ext = ["go", "html", "sql", "tmpl", "tpl"]
kill_delay = "500ms"
poll = true
poll_interval = 500
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
