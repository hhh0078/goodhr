<!-- 本文件是 GoodHR 登录验证码邮件 HTML 模板，使用后台一致的浅色绿色视觉并适配移动端。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodHR 登录验证码</title>
    <style>@media only screen and (max-width:620px){.wrap{padding:14px!important}.panel{width:100%!important}.content{padding:24px 18px!important}.title{font-size:24px!important}.code{font-size:32px!important;letter-spacing:6px!important}}</style>
  </head>
  <body bgcolor="#f4f7f5" style="margin:0;padding:0;background:#f4f7f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#1f2a23;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#f4f7f5" style="background:#f4f7f5;padding:28px 0;"><tr><td class="wrap" align="center" style="padding:0 16px;">
      <table class="panel" role="presentation" width="580" cellspacing="0" cellpadding="0" bgcolor="#ffffff" style="width:580px;max-width:100%;background:#fff;border:1px solid #dce7df;border-radius:14px;overflow:hidden;">
        <tr><td style="height:6px;background:#16724c;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td class="content" style="padding:32px 36px;">
          <div style="font-size:13px;font-weight:700;color:#16724c;margin-bottom:10px;">GOODHR · 招聘自动化助手</div>
          <h1 class="title" style="margin:0 0 12px;font-size:28px;line-height:1.3;color:#1f2a23;">验证码来啦</h1>
          <p style="margin:0 0 22px;font-size:15px;line-height:1.8;color:#56645b;">你正在登录 GoodHR，我小声把验证码放在下面。</p>
          <div align="center" style="margin:24px 0;"><span class="code" style="display:inline-block;padding:16px 28px;border:1px solid #a9c8b2;border-radius:10px;background:#eef7f1;color:#16724c;font-size:38px;font-weight:800;letter-spacing:9px;">{{.Code}}</span></div>
          <div style="padding:14px 16px;border-radius:10px;background:#f8faf8;color:#68746c;font-size:13px;line-height:1.8;">验证码 5 分钟内有效，请别转发给其他人。如果不是你操作，忽略就好，我不记仇。</div>
          <p style="margin:22px 0 0;font-size:12px;color:#8a958e;">GoodHR · 认真打工的招聘小助手</p>
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
