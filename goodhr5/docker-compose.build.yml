# 本文件部署正式环境；请通过 scripts/deploy-build.sh 加载对应公开配置。
name: ${COMPOSE_PROJECT_NAME:?必须通过环境部署脚本执行}
services:
  backend:
    image: ${COMPOSE_PROJECT_NAME}-backend:${GOODHR_RELEASE_IMAGE_TAG:?必须由发布脚本生成版本标签}
    pull_policy: never
    build:
      context: ./cloud/backend
      dockerfile: Dockerfile.release
      labels:
        goodhr.release.id: ${GOODHR_RELEASE_IMAGE_TAG}
        goodhr.source_commit: ${GOODHR_SOURCE_COMMIT:?必须指定源码提交}
        goodhr.release_kind: backend
        goodhr.dockerfile_sha256: ${GOODHR_BACKEND_DOCKERFILE_SHA:?必须先通过镜像来源检查}
    network_mode: host
    env_file: ${GOODHR_BACKEND_ENV:-./cloud/backend/.env}
    environment:
      GOODHR_PUBLIC_BASE_URL: ${GOODHR_PUBLIC_BASE_URL:?必须指定公开域名}
      GOODHR_CLOUD_ADDR: ${GOODHR_CLOUD_ADDR:?必须指定后端端口}
      GOODHR_DISABLE_EMAIL_SCHEDULER: ${GOODHR_DISABLE_EMAIL_SCHEDULER:-false}
    volumes:
      - "./cloud/backend/uploads:/app/uploads"
      - "./cloud/backend/logs:/app/logs"
      - "${GOODHR_WECHAT_SECRET_DIR:?必须指定支付密钥目录}:/run/secrets/wechat:ro"
    restart: unless-stopped
  frontend:
    image: ${COMPOSE_PROJECT_NAME}-frontend:${GOODHR_RELEASE_IMAGE_TAG:?必须由发布脚本生成版本标签}
    pull_policy: never
    build:
      context: ./cloud/frontend-next
      labels:
        goodhr.release.id: ${GOODHR_RELEASE_IMAGE_TAG}
        goodhr.source_commit: ${GOODHR_SOURCE_COMMIT:?必须指定源码提交}
        goodhr.release_kind: frontend
        goodhr.dockerfile_sha256: ${GOODHR_FRONTEND_DOCKERFILE_SHA:?必须先通过镜像来源检查}
      args:
        NEXT_PUBLIC_CLOUD_API_BASE: ${NEXT_PUBLIC_CLOUD_API_BASE:?必须指定 API 域名}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?必须指定网站域名}
        NEXT_PUBLIC_LEGACY_ADMIN_URL: "/admin/"
        CLOUD_API_BASE: ${CLOUD_API_BASE:?必须指定 API 域名}
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${GOODHR_FRONTEND_PORT:?必须指定前端端口}:3000"
    restart: unless-stopped
