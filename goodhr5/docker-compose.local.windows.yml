# 本文件只用于 Windows Docker Desktop 本地开发：启动支持热更新的后端和前端，并复用 data-services 网络中已有的 PostgreSQL 数据库。
name: goodhr5-local

services:
  # backend 使用 Air 监听 Windows 绑定目录中的 Go 代码变化并自动重启。
  backend:
    build:
      context: ./cloud/backend
      dockerfile: Dockerfile.dev
    environment:
      GOODHR_CLOUD_ADDR: ":8084"
      GOODHR_PG_DSN: "postgres://goodhr5_dev:goodhr5_dev@postgres:5432/goodhr5_dev?sslmode=disable"
    ports:
      - "8084:8084"
    volumes:
      - ./cloud/backend:/app
      - backend_tmp:/app/tmp
      - backend_go_cache:/go/pkg/mod
      - backend_build_cache:/root/.cache/go-build
    networks:
      - default
      - data-services
    restart: unless-stopped

  # frontend 使用轮询监听 Windows 绑定目录中的 Next.js 代码变化并热更新页面。
  frontend:
    build:
      context: ./cloud/frontend-next
      dockerfile: Dockerfile.dev
    command: npm run dev -- --webpack --hostname 0.0.0.0 --port 3000
    environment:
      CLOUD_API_BASE: "http://backend:8084"
      NEXT_PUBLIC_CLOUD_API_BASE: "http://localhost:8084"
      NEXT_PUBLIC_SITE_URL: "http://localhost:5173"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:3000"
    volumes:
      - ./cloud/frontend-next:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    restart: unless-stopped

networks:
  # data-services 是现有数据库容器所在的外部网络，本配置不会新建 PostgreSQL。
  data-services:
    external: true

volumes:
  # 以下命名卷只保存开发缓存，不保存或覆盖业务数据库数据。
  backend_tmp:
  backend_go_cache:
  backend_build_cache:
  frontend_node_modules:
  frontend_next_cache:
