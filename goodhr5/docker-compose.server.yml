# 本文件用于 Linux 服务器部署 GoodHR 5；后端使用宿主机网络，方便访问服务器本机暴露的 PostgreSQL 和 Redis。
services:
  backend:
    build: ./cloud/backend
    network_mode: host
    env_file: ./cloud/backend/.env
    volumes:
      - ./cloud/backend:/app
      - /app/tmp
      # 服务器宿主机目录持久化自动回复简历，备份和迁移时可直接处理该目录。
      - ./data/auto-reply-resumes:/app/data/auto-reply-resumes

  frontend:
    build: ./cloud/frontend-next
    ports: ["5173:3000"]
