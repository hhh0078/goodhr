services:
  backend:
    build: ./cloud/backend
    ports: ["8084:8084"]
    env_file: ./cloud/backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cloud/backend:/app
      - /app/tmp
      - backend_auto_reply_resumes:/app/data/auto-reply-resumes

  frontend:
    build:
      context: ./cloud/frontend-next
      dockerfile: Dockerfile.dev
    command: npm run dev -- --webpack --hostname 0.0.0.0 --port 3000
    environment:
      CLOUD_API_BASE: "http://backend:8084"
      NEXT_PUBLIC_CLOUD_API_BASE: "http://localhost:8084"
      NEXT_PUBLIC_SITE_URL: "http://localhost:5173"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:3000"
    volumes:
      - ./cloud/frontend-next:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

volumes:
  # 自动回复取得的简历附件保存在独立持久化卷，重建后端容器不会丢失。
  backend_auto_reply_resumes:
  frontend_node_modules:
  frontend_next_cache:
