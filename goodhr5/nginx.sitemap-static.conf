# 本文件在GoodHR现有server块中引入，仅把公开站点地图交给Nginx读静态文件。
# 先运行scripts/refresh_public_sitemap.py并确认current/sitemap.xml有效，再安装此配置。
location = /sitemap.xml {
    alias /www/wwwroot/goodhr-production/seo-static/current/sitemap.xml;
    default_type application/xml;
    gzip off;
    etag on;
    open_file_cache off;
    # expires生成no-cache，不用add_header覆盖父级HSTS等安全响应头的继承。
    expires -1;
}

# 使用更具体的^~前缀，避免被现有location ^~ /的Next反代截走。
location ^~ /sitemaps/ {
    root /www/wwwroot/goodhr-production/seo-static/current;
    try_files $uri =404;
    default_type application/xml;
    gzip off;
    etag on;
    autoindex off;
    open_file_cache off;
    expires -1;
}
