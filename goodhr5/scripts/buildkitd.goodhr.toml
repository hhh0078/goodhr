# 文件作用：仅约束GoodHR独立构建器；保留最多4GiB缓存复用依赖，构建并行度为1，不修改Docker全局配置。
[worker.oci]
  max-parallelism = 1
  gc = true
  reservedSpace = "0"
  maxUsedSpace = "4GiB"
  minFreeSpace = "3GiB"
  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "0"
    maxUsedSpace = "4GiB"
    minFreeSpace = "3GiB"
[history]
  maxEntries = 2
[registry."docker.io"]
  mirrors = ["docker.m.daocloud.io", "docker.1ms.run", "docker.1panel.live"]
